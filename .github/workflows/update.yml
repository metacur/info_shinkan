name: Update bunko shinkan data

on:
  schedule:
    # 毎日 22:00 UTC = 日本時間 朝7:00 に実行
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # 手動実行用ボタンを有効にする

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run update script
        run: python scripts/update_books.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_isbns.json docs/data/books.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update shinkan data ($(date -u +'%Y-%m-%d'))"
            git push
          fi
